name: Windows Build

run-name: Build Windows versions of MeshAgent

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: ${{ matrix.platform == 'ARM64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
    - uses: actions/checkout@v7
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v3
    - name: Install MFC v142
      if: matrix.platform != 'ARM64'
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        
        $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        $components = @(
          "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC",
          "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL"
        )
        
        $Arguments = @(
          'modify',
          '--installPath', $InstallPath,
          '--quiet',
          '--norestart',
          '--nocache',
          '--log', 'vs_install.log'
        )
        
        foreach ($component in $components) {
          $Arguments += '--add', $component
        }
        
        # Run twice
        & ".\vs_installer.exe" @Arguments
        & ".\vs_installer.exe" @Arguments
        
        # Output the log to console
        if (Test-Path "vs_install.log") {
          Write-Host "=== VS Installer Log ==="
          Get-Content "vs_install.log"
        }
    - name: Build ${{ matrix.platform }}
      run: msbuild MeshAgent-2022.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }}
    - name: Upload ${{ matrix.platform }} artifacts
      uses: actions/upload-artifact@v7
      with:
        name: meshagent-windows-${{ matrix.platform }}
        path: Release/*.exe
